# CD: runs only after `ci` succeeds on main (or on a version tag). Builds the release image
# once, scans it, signs it and records where it came from, then deploys behind the
# `production` environment and verifies the live system.
#
#   image ─▶ scan (gate) ─▶ sign + provenance + SBOM ─┬─▶ deploy API (Render) ─┐
#                                                    └─▶ deploy web (Vercel) ─┴─▶ smoke ─▶ DAST baseline
#   tag v*: + Android build (EAS) + GitHub Release with the SBOM
#
# Each deploy step is skipped (not failed) until its secret is configured - see
# docs/PIPELINE.md for the list.
name: cd

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false # never interrupt a deploy halfway

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ayurnidaan-api
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  API_URL: ${{ vars.API_URL || 'https://ayurnidaan-api.onrender.com' }}
  WEB_URL: ${{ vars.WEB_URL || 'https://ayurnidaan.vercel.app' }}

jobs:
  image:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless signing (Sigstore) + attestations
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=sha-${{ env.SHA }}
            type=raw,value=main,enable=${{ github.ref_type != 'tag' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ env.SHA }}
          provenance: mode=max # SLSA build provenance, attached to the image
          sbom: true # BuildKit SBOM, attached to the image
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Gate: the exact image that ships must have no fixable HIGH/CRITICAL CVEs.
      - name: Scan the pushed image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign (keyless, Sigstore)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90
      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "### Release image"
            echo "\`${IMAGE}@${DIGEST}\`"
            echo
            echo "Verify: \`cosign verify ${IMAGE}@${DIGEST} --certificate-identity-regexp 'https://github.com/${REPO}/' --certificate-oidc-issuer https://token.actions.githubusercontent.com\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-api:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ vars.API_URL || 'https://ayurnidaan-api.onrender.com' }}
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deploy
        if: env.HOOK != ''
        run: curl -fsS -X POST "$HOOK" -o /dev/null
      - name: Not configured
        if: env.HOOK == ''
        run: echo "::notice::RENDER_DEPLOY_HOOK_URL is not set - API deploy skipped"

  deploy-web:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-web
      url: ${{ vars.WEB_URL || 'https://ayurnidaan.vercel.app' }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      EXPO_PUBLIC_API_URL: ${{ vars.API_URL || 'https://ayurnidaan-api.onrender.com' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.VERCEL_TOKEN != ''
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Build and deploy (prebuilt, production)
        if: env.VERCEL_TOKEN != ''
        run: |
          npx --yes vercel@62.4.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@62.4.0 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@62.4.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Not configured
        if: env.VERCEL_TOKEN == ''
        working-directory: .
        run: echo "::notice::VERCEL_TOKEN is not set - web deploy skipped"

  verify:
    name: smoke + DAST (production)
    needs: [deploy-api, deploy-web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENABLED: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.ENABLED == 'true'
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      # Waits for the new commit to be live (free tier cold starts), then checks health,
      # database, headers, auth, CORS, docs-off and the web bundle.
      - name: Smoke test
        if: env.ENABLED == 'true'
        run: >
          python3 scripts/smoke.py --production --api "$API_URL" --web "$WEB_URL"
          --expect-commit "$SHA" --wait 1200
      # Passive scan only: production holds real patient data, so no active attacks here
      # (the active API scan runs against a throwaway container in ci.yml).
      - name: DAST baseline (OWASP ZAP, passive)
        if: env.ENABLED == 'true'
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ env.WEB_URL }}
          rules_file_name: .zap/rules.tsv
          cmd_options: -I
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline

  android:
    name: Android build (EAS)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.EXPO_TOKEN != ''
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.EXPO_TOKEN != ''
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
        if: env.EXPO_TOKEN != ''
        with:
          eas-version: 24.11.0
          token: ${{ secrets.EXPO_TOKEN }}
      - if: env.EXPO_TOKEN != ''
        run: npm ci
      # Builds the signed app bundle on EAS and queues it for the Play internal track.
      - if: env.EXPO_TOKEN != ''
        run: eas build --platform android --profile production --non-interactive --no-wait --auto-submit
      - if: env.EXPO_TOKEN == ''
        working-directory: .
        run: echo "::notice::EXPO_TOKEN is not set - Android build skipped"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: sbom.spdx.json
          body: |
            Container image: `ghcr.io/${{ github.repository_owner }}/ayurnidaan-api@${{ needs.image.outputs.digest }}`
            (signed with Sigstore; SLSA provenance and SBOM attached to the image).
