name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[api,dashboard,dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Migrations match the models
        env:
          AYUR_DATABASE_URL: sqlite:///ci.db
        run: |
          alembic upgrade head
          alembic check
      # Raw Kaggle data is not in the repo: integration tests skip themselves and the full
      # pipeline + API run end-to-end on schema-faithful synthetic sources.
      - name: Test
        run: pytest --cov=ayurnidaan --cov-report=term-missing --cov-fail-under=85

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx expo export -p web
        env:
          EXPO_PUBLIC_API_URL: https://ayurnidaan-api.onrender.com

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ayurnidaan-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
