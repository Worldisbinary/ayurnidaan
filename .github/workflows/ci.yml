# CI: every push and pull request. Quality gates + the container, scanned and attacked
# (DAST) locally before anything can ship. CD (cd.yml) only runs after this passes on main.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[api,dashboard,dev]"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Migrations match the models
        env:
          AYUR_DATABASE_URL: sqlite:///ci.db
        run: |
          alembic upgrade head
          alembic check
      # Raw Kaggle data is not in the repo: integration tests skip themselves and the full
      # pipeline + API run end-to-end on schema-faithful synthetic sources.
      - name: Test
        run: pytest --cov=ayurnidaan --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: Coverage report
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx expo export -p web
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.API_URL || 'https://ayurnidaan-api.onrender.com' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: mobile/dist
          retention-days: 7

  container:
    name: container (build · scan · smoke · DAST)
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ayurnidaan-api:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Gate: any HIGH/CRITICAL vulnerability that has a fix available fails the build.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ayurnidaan-api:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
      - name: Start the container
        run: |
          docker run -d --name api -p 8000:8000 \
            -e AYUR_ENVIRONMENT=development \
            -e AYUR_RATE_LIMIT_PER_MINUTE=100000 \
            -e AYUR_DATABASE_URL=sqlite:////tmp/ci.db \
            ayurnidaan-api:ci
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/ready && exit 0
            sleep 2
          done
          docker logs api; exit 1
      - name: Smoke test
        run: python3 scripts/smoke.py --api http://localhost:8000 --expect-commit "$GITHUB_SHA" --wait 60
      # DAST: an active OWASP ZAP scan of every endpoint in the OpenAPI spec, against the
      # throwaway container - never against production. High-impact rules (.zap/rules.tsv)
      # fail the build; everything else is reported in the artifact.
      - name: DAST (OWASP ZAP API scan)
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          target: http://localhost:8000/openapi.json
          format: openapi
          rules_file_name: .zap/rules.tsv
          cmd_options: -I
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-api-scan
      - name: Container logs
        if: failure()
        run: docker logs api
