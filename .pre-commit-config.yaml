# Local guard rails, the same checks CI runs, caught before the commit exists.
#   pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=800]
        exclude: ^knowledge_pack/
      - id: end-of-file-fixer
        exclude: ^knowledge_pack/
      - id: trailing-whitespace
        exclude: ^knowledge_pack/
      - id: forbid-new-submodules

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -ll, -q]
        additional_dependencies: ["bandit[toml]"]
        files: ^src/

  - repo: local
    hooks:
      # Raw Kaggle data contains real names; it must never be committed.
      - id: no-raw-data
        name: raw data stays out of git
        entry: raw data under data/ must not be committed
        language: fail
        files: ^data/
