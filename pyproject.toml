[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ayurnidaan"
version = "1.2.0"
description = "Ayurvedic clinical analytics platform: symptom clustering, screening-feature selection, predictive-variable discovery and a clinician dashboard over integrated Kaggle sources."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aman Arora" }]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
  # Pinned: pickled screening models only load under the version that built them, and
  # 1.9.x binaries are currently blocked by Windows Smart App Control on the dev machine.
  "scikit-learn==1.8.0",
  "statsmodels>=0.14",
  "networkx>=3.2",
  "duckdb>=1.0",
  "pyarrow>=15",
  "pyyaml>=6",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "joblib>=1.3",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "sqlalchemy>=2.0", "alembic>=1.13",
  "pyjwt>=2.8", "email-validator>=2.1", "psycopg[binary]>=3.2",
]
dashboard = ["streamlit>=1.45", "plotly>=5.20"]
ingest = ["kaggle>=1.6"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5", "bandit[toml]>=1.8", "pip-audit>=2.7", "pre-commit>=3.7"]
all = ["ayurnidaan[api,dashboard,ingest,dev]"]

[project.scripts]
ayur = "ayurnidaan.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ayurnidaan"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PD", "NPY", "RUF"]
# E501: line length is owned by `ruff format`; PD008: .at is the right tool for scalar access.
ignore = ["E501", "PD008", "PD010", "RUF001", "RUF002", "RUF003", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: needs the real Kaggle data under data/raw"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "mobile", "migrations"]
# B404: importing subprocess is fine; the one call site is reviewed (B603 nosec in cli.py).
skips = ["B404"]
